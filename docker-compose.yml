services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    volumes:
      - pgdata:/var/lib/postgresql/data

  demo-service:
    build: ./demo-service
    ports:
      - "8000:8000"
    restart: unless-stopped

  pulse-checker:
    build: ./pulse-checker
    environment:
      TARGET_URL: http://demo-service:8000/health
      DATABASE_URL: postgresql://pulse:pulse@db:5432/pulse
      CHECK_INTERVAL: "10"
      FAIL_THRESHOLD: "3"
    depends_on:
      - db
      - demo-service
    restart: unless-stopped

volumes:
  pgdata:
